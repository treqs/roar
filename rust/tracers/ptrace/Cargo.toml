[package]
name = "roar-tracer"
version = "0.1.0"
edition = "2021"
description = "ptrace-based syscall tracer for roar provenance tracking"

[dependencies]
nix = { version = "0.29", features = ["ptrace", "process", "signal"] }
anyhow = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
libc = "0.2"
tracer-schema = { path = "../../crates/tracer-schema" }
tracer-runtime = { path = "../../crates/tracer-runtime" }
tracer-fd = { path = "../../crates/tracer-fd" }

[[bin]]
name = "roar-tracer"
path = "src/main.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
too_many_arguments = "allow"
