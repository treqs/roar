services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks:
      - roar-ray-test

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/test-bucket --ignore-existing &&
      mc mb local/output-bucket --ignore-existing
      "
    networks:
      - roar-ray-test

  ray-head:
    build:
      context: ../../../../
      dockerfile: tests/backends/ray/e2e/Dockerfile
    command: >
      bash -lc "ray start --head --port=6379 --dashboard-host=0.0.0.0 --num-cpus=2 --ray-client-server-port=10001 --block"
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6379:6379"
      - "8265:8265"
      - "10001:10001"
    healthcheck:
      test: ["CMD-SHELL", "ray status >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - roar-ray-test

  ray-worker-1:
    build:
      context: ../../../../
      dockerfile: tests/backends/ray/e2e/Dockerfile
    command: >
      bash -lc "ray start --address=ray-head:6379 --num-cpus=2 --block"
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      ray-head:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - roar-ray-test

  ray-worker-2:
    build:
      context: ../../../../
      dockerfile: tests/backends/ray/e2e/Dockerfile
    command: >
      bash -lc "ray start --address=ray-head:6379 --num-cpus=2 --block"
    environment:
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      ray-head:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - roar-ray-test

networks:
  roar-ray-test:
    driver: bridge
