# MinIO for S3 lineage scenarios.
#
# Cluster-visible endpoint: http://minio:9000 (namespace roar-e2e)
# Host-visible endpoint:    http://localhost:39000 (NodePort 30900 mapped by
#                           kind-config.yaml on the control-plane node)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: roar-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: roar-e2e
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30900
