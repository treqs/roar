name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff linting
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          pip install -e .[dev]

      - name: Run mypy
        run: mypy roar

  build-tracer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build tracer
        run: cargo build --release --manifest-path rust/Cargo.toml -p roar-tracer

      - name: Upload tracer artifact
        uses: actions/upload-artifact@v4
        with:
          name: roar-tracer
          path: rust/target/release/roar-tracer

  build-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build proxy
        run: cargo build --release --manifest-path rust/Cargo.toml -p roar-proxy

      - name: Upload proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: roar-proxy
          path: rust/target/release/roar-proxy

  build-tracer-ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust (nightly with rust-src)
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build eBPF tracer
        run: cargo build --release --manifest-path rust/Cargo.toml -p roar-tracer-ebpf

      - name: Upload eBPF tracer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roar-tracer-ebpf
          path: |
            rust/target/release/roar-tracer-ebpf
            rust/target/release/roard

  test:
    runs-on: ubuntu-latest
    needs: [build-tracer, build-proxy, build-tracer-ebpf]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download tracer
        uses: actions/download-artifact@v4
        with:
          name: roar-tracer
          path: rust/target/release/

      - name: Make tracer executable
        run: chmod +x rust/target/release/roar-tracer

      - name: Download proxy
        uses: actions/download-artifact@v4
        with:
          name: roar-proxy
          path: rust/target/release/

      - name: Make proxy executable
        run: chmod +x rust/target/release/roar-proxy

      - name: Download eBPF tracer
        uses: actions/download-artifact@v4
        with:
          name: roar-tracer-ebpf
          path: rust/target/release/

      - name: Make eBPF tracer executables
        run: chmod +x rust/target/release/roar-tracer-ebpf rust/target/release/roard

      - name: Check ptrace availability
        run: |
          echo "Testing if ptrace is available on this runner..."
          TRACER=rust/target/release/roar-tracer
          TEST_LOG=/tmp/ptrace_test.json
          if $TRACER $TEST_LOG echo "ptrace test" 2>&1; then
            if [ -f "$TEST_LOG" ] && [ -s "$TEST_LOG" ]; then
              echo "✓ ptrace is available - tracer can capture syscalls"
              cat $TEST_LOG
            else
              echo "⚠ ptrace may be restricted - tracer ran but produced no output"
            fi
          else
            echo "⚠ ptrace appears to be disabled - tracer failed to run"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          pip install -e .[dev]

      - name: Build native hash extension
        run: ./scripts/build_hash_native.sh

      - name: Verify native hash extension import
        run: python -c "import roar._hash_native as m; print(m.__name__)"

      - name: Run tests (parallel)
        run: pytest --tb=short -x -m "not glaas and not live_glaas"
