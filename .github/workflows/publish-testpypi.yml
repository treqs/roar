name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no upload)"
        required: false
        default: false
        type: boolean

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: testpypi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust (nightly with rust-src)
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build proxy
        run: cargo build --release --manifest-path proxy/Cargo.toml

      - name: Build eBPF tracer
        run: cargo build --release --manifest-path tracer-ebpf/Cargo.toml

      - name: Copy binaries to roar/bin
        run: |
          mkdir -p roar/bin
          cp proxy/target/release/roar-proxy roar/bin/
          cp tracer-ebpf/target/release/roar-tracer-ebpf roar/bin/
          cp tracer-ebpf/target/release/roard roar/bin/

      - name: Clean previous builds
        run: rm -rf dist/ build/ *.egg-info/

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload to TestPyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --verbose --repository testpypi dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
