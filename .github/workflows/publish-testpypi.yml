name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no upload)"
        required: false
        default: false
        type: boolean

jobs:
  build-rust-binaries-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust (nightly with rust-src)
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build and stage Rust binaries
        uses: ./.github/actions/build-rust-binaries
        with:
          manifest-path: rust/Cargo.toml
          output-dir: rust-bin

      - name: Upload Rust binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: roar-rust-binaries-linux-x86_64
          path: rust-bin/*

  build-rust-binaries-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build and stage Rust binaries
        uses: ./.github/actions/build-rust-binaries-macos
        with:
          manifest-path: rust/Cargo.toml
          output-dir: rust-bin

      - name: Upload Rust binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: roar-rust-binaries-macos-${{ matrix.arch }}
          path: rust-bin/*

  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - python-version: "3.10"
            py-tag: "cp310"
            runner: ubuntu-latest
            artifact-name: roar-rust-binaries-linux-x86_64
            platform: linux
            platform-tag: linux-x86_64
          - python-version: "3.11"
            py-tag: "cp311"
            runner: ubuntu-latest
            artifact-name: roar-rust-binaries-linux-x86_64
            platform: linux
            platform-tag: linux-x86_64
          - python-version: "3.12"
            py-tag: "cp312"
            runner: ubuntu-latest
            artifact-name: roar-rust-binaries-linux-x86_64
            platform: linux
            platform-tag: linux-x86_64
          - python-version: "3.13"
            py-tag: "cp313"
            runner: ubuntu-latest
            artifact-name: roar-rust-binaries-linux-x86_64
            platform: linux
            platform-tag: linux-x86_64
          # macOS ARM64
          - python-version: "3.10"
            py-tag: "cp310"
            runner: macos-latest
            artifact-name: roar-rust-binaries-macos-arm64
            platform: macos
            platform-tag: macos-arm64
          - python-version: "3.11"
            py-tag: "cp311"
            runner: macos-latest
            artifact-name: roar-rust-binaries-macos-arm64
            platform: macos
            platform-tag: macos-arm64
          - python-version: "3.12"
            py-tag: "cp312"
            runner: macos-latest
            artifact-name: roar-rust-binaries-macos-arm64
            platform: macos
            platform-tag: macos-arm64
          - python-version: "3.13"
            py-tag: "cp313"
            runner: macos-latest
            artifact-name: roar-rust-binaries-macos-arm64
            platform: macos
            platform-tag: macos-arm64
          # macOS x86_64
          - python-version: "3.10"
            py-tag: "cp310"
            runner: macos-15-intel
            artifact-name: roar-rust-binaries-macos-x86_64
            platform: macos
            platform-tag: macos-x86_64
          - python-version: "3.11"
            py-tag: "cp311"
            runner: macos-15-intel
            artifact-name: roar-rust-binaries-macos-x86_64
            platform: macos
            platform-tag: macos-x86_64
          - python-version: "3.12"
            py-tag: "cp312"
            runner: macos-15-intel
            artifact-name: roar-rust-binaries-macos-x86_64
            platform: macos
            platform-tag: macos-x86_64
          - python-version: "3.13"
            py-tag: "cp313"
            runner: macos-15-intel
            artifact-name: roar-rust-binaries-macos-x86_64
            platform: macos
            platform-tag: macos-x86_64

    runs-on: ${{ matrix.runner }}
    needs: [build-rust-binaries-linux, build-rust-binaries-macos]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Download Rust binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: rust-bin/

      - name: Copy binaries to roar/bin
        uses: ./.github/actions/copy-rust-binaries
        with:
          source-dir: rust-bin
          destination-dir: roar/bin
          platform: ${{ matrix.platform }}

      - name: Build wheel via maturin
        run: maturin build --release --manifest-path rust/crates/artifact-hash-py/Cargo.toml --interpreter python --out dist

      - name: Verify wheel contains native extension and binaries
        env:
          ROAR_WHEEL_PLATFORM: ${{ matrix.platform }}
        run: python scripts/ci/verify_wheel_contents.py

      - name: Install and smoke test wheel
        env:
          ROAR_WHEEL_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install --force-reinstall dist/*.whl
          tmp_dir="$(mktemp -d)"
          cp scripts/ci/verify_installed_distribution.py "${tmp_dir}/"
          (
            cd "${tmp_dir}"
            python verify_installed_distribution.py
          )

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.py-tag }}-${{ matrix.platform-tag }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    needs: build-rust-binaries-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Download Rust binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: roar-rust-binaries-linux-x86_64
          path: rust-bin/

      - name: Copy binaries to roar/bin
        uses: ./.github/actions/copy-rust-binaries
        with:
          source-dir: rust-bin
          destination-dir: roar/bin

      - name: Build sdist via maturin
        run: maturin sdist --manifest-path rust/crates/artifact-hash-py/Cargo.toml --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build-wheel, build-sdist]
    environment: testpypi

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Verify expected wheel matrix
        run: |
          python - <<'PY'
          import glob
          import os

          wheels = sorted(glob.glob("dist/*.whl"))
          expected_count = 12
          expected_py_tags = {"cp310", "cp311", "cp312", "cp313"}

          print("Found wheels:")
          for wheel in wheels:
              print(f"  - {os.path.basename(wheel)}")

          if len(wheels) != expected_count:
              raise SystemExit(f"Expected {expected_count} wheels, found {len(wheels)}")

          found_py_tags = {os.path.basename(w).split("-")[2] for w in wheels}
          if found_py_tags != expected_py_tags:
              raise SystemExit(
                  f"Expected Python tags {sorted(expected_py_tags)}, "
                  f"found {sorted(found_py_tags)}"
              )

          # Verify we have wheels for all 3 platform tags
          wheel_basenames = [os.path.basename(w) for w in wheels]
          has_linux = any("linux" in w for w in wheel_basenames)
          has_macos_arm = any("macosx" in w and "arm64" in w for w in wheel_basenames)
          has_macos_x86 = any("macosx" in w and "x86_64" in w for w in wheel_basenames)

          if not has_linux:
              raise SystemExit("Missing Linux wheels")
          if not has_macos_arm:
              raise SystemExit("Missing macOS ARM64 wheels")
          if not has_macos_x86:
              raise SystemExit("Missing macOS x86_64 wheels")

          print(f"Verified {len(wheels)} wheels across all platforms")
          PY

      - name: Check distribution
        run: twine check dist/*

      - name: Upload to TestPyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --verbose --repository testpypi dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
