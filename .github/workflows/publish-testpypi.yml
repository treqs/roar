name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no upload)"
        required: false
        default: false
        type: boolean

jobs:
  build-rust-binaries-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu.2.17
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu.2.17
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust (nightly with rust-src)
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Build and stage Rust binaries
        uses: ./.github/actions/build-rust-binaries
        with:
          manifest-path: rust/Cargo.toml
          output-dir: rust-bin
          target: ${{ matrix.target }}

      - name: Upload Rust binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: roar-rust-binaries-linux-${{ matrix.arch }}
          path: rust-bin/*

  build-rust-binaries-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build and stage Rust binaries
        uses: ./.github/actions/build-rust-binaries-macos
        with:
          manifest-path: rust/Cargo.toml
          output-dir: rust-bin

      - name: Upload Rust binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: roar-rust-binaries-macos-${{ matrix.arch }}
          path: rust-bin/*

  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One abi3 wheel per platform. The `cp310-abi3` wheel covers every
          # CPython >= 3.10 — including versions newer than the build
          # interpreter — so new Python releases no longer need a matrix entry
          # (and never silently lose a wheel). See the `abi3-py310` feature in
          # rust/crates/artifact-hash-py/Cargo.toml.
          - runner: ubuntu-latest
            artifact-name: roar-rust-binaries-linux-x86_64
            platform: linux
            platform-tag: linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact-name: roar-rust-binaries-linux-aarch64
            platform: linux
            platform-tag: linux-aarch64
          - runner: macos-latest
            artifact-name: roar-rust-binaries-macos-arm64
            platform: macos
            platform-tag: macos-arm64
            # apple silicon starts at macOS 11; this is the effective floor.
            macos-deployment-target: "11.0"
          - runner: macos-15-intel
            artifact-name: roar-rust-binaries-macos-x86_64
            platform: macos
            platform-tag: macos-x86_64
            # Pin the Intel floor explicitly. Without this the single abi3 build
            # host (3.12) would set the floor from its own interpreter, which
            # could silently raise it above the 10.12 the per-version wheels had.
            macos-deployment-target: "10.12"

    runs-on: ${{ matrix.runner }}
    needs: [build-rust-binaries-linux, build-rust-binaries-macos]

    steps:
      - uses: actions/checkout@v4

      # abi3 builds one wheel per platform regardless of this interpreter; any
      # supported CPython works as the build host. Pin 3.12 for reproducibility.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Download Rust binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: rust-bin/

      - name: Copy binaries to roar/bin
        uses: ./.github/actions/copy-rust-binaries
        with:
          source-dir: rust-bin
          destination-dir: roar/bin
          platform: ${{ matrix.platform }}

      - name: Build wheel via maturin
        # MACOSX_DEPLOYMENT_TARGET is empty (ignored) on Linux jobs and pins the
        # macOS floor on macOS jobs so the single abi3 build host doesn't drift it.
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
        run: maturin build --release --manifest-path rust/crates/artifact-hash-py/Cargo.toml --interpreter python --out dist

      - name: Verify wheel contains native extension and binaries
        env:
          ROAR_WHEEL_PLATFORM: ${{ matrix.platform }}
        run: python scripts/ci/verify_wheel_contents.py

      - name: Install and smoke test wheel
        env:
          ROAR_WHEEL_PLATFORM: ${{ matrix.platform }}
        run: |
          python -m pip install --force-reinstall dist/*.whl
          tmp_dir="$(mktemp -d)"
          cp scripts/ci/verify_installed_distribution.py "${tmp_dir}/"
          (
            cd "${tmp_dir}"
            python verify_installed_distribution.py
          )

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform-tag }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      # No pre-built binaries are bundled into the sdist (see [tool.maturin]
      # `include` in pyproject.toml). sdist installs build the tracer
      # binaries from the rust/ source tree.
      - name: Build sdist via maturin
        run: maturin sdist --manifest-path rust/crates/artifact-hash-py/Cargo.toml --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build-wheel, build-sdist]
    environment: testpypi

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Verify expected wheel matrix
        run: |
          python - <<'PY'
          import glob
          import os

          wheels = sorted(glob.glob("dist/*.whl"))
          # One abi3 wheel per platform (4 platforms). abi3 means a single
          # wheel per platform covers all CPython >= 3.10, so the count no
          # longer scales with the number of supported Python versions.
          expected_count = 4

          print("Found wheels:")
          for wheel in wheels:
              print(f"  - {os.path.basename(wheel)}")

          if len(wheels) != expected_count:
              raise SystemExit(f"Expected {expected_count} wheels, found {len(wheels)}")

          # Every wheel must be abi3 (filename: ...-cp310-abi3-<platform>.whl).
          non_abi3 = [os.path.basename(w) for w in wheels if "-abi3-" not in os.path.basename(w)]
          if non_abi3:
              raise SystemExit(f"Expected only abi3 wheels, found non-abi3: {non_abi3}")

          # Verify we have wheels for all 4 platform tags
          wheel_basenames = [os.path.basename(w) for w in wheels]
          has_linux_x86 = any("linux" in w and "x86_64" in w for w in wheel_basenames)
          has_linux_arm = any("linux" in w and "aarch64" in w for w in wheel_basenames)
          has_macos_arm = any("macosx" in w and "arm64" in w for w in wheel_basenames)
          has_macos_x86 = any("macosx" in w and "x86_64" in w for w in wheel_basenames)

          if not has_linux_x86:
              raise SystemExit("Missing Linux x86_64 wheels")
          if not has_linux_arm:
              raise SystemExit("Missing Linux aarch64 wheels")
          if not has_macos_arm:
              raise SystemExit("Missing macOS ARM64 wheels")
          if not has_macos_x86:
              raise SystemExit("Missing macOS x86_64 wheels")

          print(f"Verified {len(wheels)} wheels across all platforms")
          PY

      - name: Check distribution
        run: twine check dist/*

      - name: Upload to TestPyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --verbose --repository testpypi dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
