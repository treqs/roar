name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no upload)"
        required: false
        default: false
        type: boolean

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust (nightly with rust-src)
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine tomli

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        run: |
          # Extract version from pyproject.toml
          PACKAGE_VERSION=$(python -c "import tomli; print(tomli.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # Extract version from release tag (strip 'v' prefix if present)
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${RELEASE_TAG#v}"

          echo "Package version: $PACKAGE_VERSION"
          echo "Release tag version: $TAG_VERSION"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Version mismatch!"
            echo "pyproject.toml version ($PACKAGE_VERSION) does not match release tag ($TAG_VERSION)"
            exit 1
          fi

          echo "Version verified successfully"

      - name: Build proxy
        run: cargo build --release --manifest-path rust/Cargo.toml -p roar-proxy

      - name: Build ptrace tracer
        run: cargo build --release --manifest-path rust/Cargo.toml -p roar-tracer

      - name: Build eBPF tracer
        run: cargo build --release --manifest-path rust/Cargo.toml -p roar-tracer-ebpf

      - name: Build native hash extension
        run: ./scripts/build_hash_native.sh

      - name: Copy binaries to roar/bin
        run: |
          mkdir -p roar/bin
          cp rust/target/release/roar-tracer roar/bin/
          cp rust/target/release/roar-proxy roar/bin/
          cp rust/target/release/roar-tracer-ebpf roar/bin/
          cp rust/target/release/roard roar/bin/

      - name: Verify native hash extension import
        run: python -c "import roar._hash_native as m; print(m.__name__)"

      - name: Clean previous builds
        run: rm -rf dist/ build/ *.egg-info/

      - name: Build distribution
        run: python -m build

      - name: Verify distribution contains native extension and binaries
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          if not wheels:
              raise SystemExit("No wheel produced in dist/")

          wheel = wheels[-1]
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())

          required_bins = {
              "roar/bin/roar-tracer",
              "roar/bin/roar-proxy",
              "roar/bin/roar-tracer-ebpf",
              "roar/bin/roard",
          }
          missing_bins = sorted(path for path in required_bins if path not in names)
          if missing_bins:
              raise SystemExit(f"Missing binaries in wheel: {missing_bins}")

          has_native = any(
              name.startswith("roar/_hash_native")
              and (name.endswith(".so") or name.endswith(".pyd") or name.endswith(".dylib"))
              for name in names
          )
          if not has_native:
              raise SystemExit("Missing native hash extension in wheel (roar/_hash_native*)")

          print(f"Verified wheel contents: {wheel}")
          PY

      - name: Check distribution
        run: twine check dist/*

      - name: Upload to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release artifacts
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
