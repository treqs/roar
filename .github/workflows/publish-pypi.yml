name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no upload)"
        required: false
        default: false
        type: boolean

jobs:
  build-rust-binaries:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Rust (nightly with rust-src)
        run: |
          rustup install nightly
          rustup component add rust-src --toolchain nightly

      - name: Install bpf-linker
        run: cargo install bpf-linker

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          pkg = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag.startswith("v"):
              tag = tag[1:]

          print(f"Package version: {pkg}")
          print(f"Release tag version: {tag}")

          if pkg != tag:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={pkg} release_tag={tag}"
              )

          print("Version verified successfully")
          PY

      - name: Build and stage Rust binaries
        uses: ./.github/actions/build-rust-binaries
        with:
          manifest-path: rust/Cargo.toml
          output-dir: rust-bin

      - name: Upload Rust binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: roar-rust-binaries
          path: rust-bin/*

  build-wheel:
    runs-on: ubuntu-latest
    needs: build-rust-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            py-tag: "cp310"
          - python-version: "3.11"
            py-tag: "cp311"
          - python-version: "3.12"
            py-tag: "cp312"
          - python-version: "3.13"
            py-tag: "cp313"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Download Rust binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: roar-rust-binaries
          path: rust-bin/

      - name: Copy binaries to roar/bin
        uses: ./.github/actions/copy-rust-binaries
        with:
          source-dir: rust-bin
          destination-dir: roar/bin

      - name: Build wheel via maturin
        run: maturin build --release --manifest-path rust/crates/artifact-hash-py/Cargo.toml --interpreter python --out dist

      - name: Verify wheel contains native extension and binaries
        run: python scripts/ci/verify_wheel_contents.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.py-tag }}
          path: dist/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    needs: build-rust-binaries

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Download Rust binaries artifact
        uses: actions/download-artifact@v4
        with:
          name: roar-rust-binaries
          path: rust-bin/

      - name: Copy binaries to roar/bin
        uses: ./.github/actions/copy-rust-binaries
        with:
          source-dir: rust-bin
          destination-dir: roar/bin

      - name: Build sdist via maturin
        run: maturin sdist --manifest-path rust/crates/artifact-hash-py/Cargo.toml --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build-wheel, build-sdist]
    environment: pypi

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/

      - name: Verify expected wheel matrix
        run: |
          python - <<'PY'
          import glob

          wheels = sorted(glob.glob("dist/*.whl"))
          expected = {"cp310", "cp311", "cp312", "cp313"}
          found = {wheel.split("-")[2] for wheel in wheels}

          print("Found wheels:")
          for wheel in wheels:
              print(f"  - {wheel}")

          if found != expected:
              raise SystemExit(f"Expected wheel tags {sorted(expected)}, found {sorted(found)}")
          PY

      - name: Check distribution
        run: twine check dist/*

      - name: Upload to PyPI
        if: ${{ !inputs.dry_run }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release artifacts
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
