name: Build Rust Binaries (macOS)
description: Build and stage macOS-compatible roar Rust binaries into an output directory
inputs:
  manifest-path:
    description: Path to rust workspace manifest
    required: false
    default: rust/Cargo.toml
  output-dir:
    description: Directory to place built binaries
    required: false
    default: rust-bin
runs:
  using: composite
  steps:
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Build proxy
      shell: bash
      run: cargo build --release --manifest-path "${{ inputs.manifest-path }}" -p roar-proxy

    - name: Build preload tracer
      shell: bash
      run: cargo build --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer-preload

    - name: Stage Rust binaries
      shell: bash
      run: |
        mkdir -p "${{ inputs.output-dir }}"
        cp rust/target/release/roar-proxy "${{ inputs.output-dir }}/"
        cp rust/target/release/roar-tracer-preload "${{ inputs.output-dir }}/"

        shopt -s nullglob
        preload_libs=(
          rust/target/release/libroar_tracer_preload*.dylib
          rust/target/release/libroar-tracer-preload*.dylib
        )
        if [ "${#preload_libs[@]}" -gt 0 ]; then
          cp "${preload_libs[@]}" "${{ inputs.output-dir }}/"
        fi
