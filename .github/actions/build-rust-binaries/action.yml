name: Build Rust Binaries
description: Build and stage roar Rust binaries into an output directory
inputs:
  manifest-path:
    description: Path to rust workspace manifest
    required: false
    default: rust/Cargo.toml
  output-dir:
    description: Directory to place built binaries
    required: false
    default: rust-bin
runs:
  using: composite
  steps:
    - name: Install cargo-zigbuild and zig
      shell: bash
      run: |
        cargo install cargo-zigbuild
        pip install ziglang

    - name: Build proxy (glibc 2.17 minimum)
      shell: bash
      run: cargo zigbuild --release --manifest-path "${{ inputs.manifest-path }}" -p roar-proxy --target x86_64-unknown-linux-gnu.2.17

    - name: Build ptrace tracer (glibc 2.17 minimum)
      shell: bash
      run: cargo zigbuild --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer --target x86_64-unknown-linux-gnu.2.17

    - name: Build eBPF tracer (glibc 2.17 minimum)
      shell: bash
      run: cargo zigbuild --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer-ebpf --target x86_64-unknown-linux-gnu.2.17

    - name: Build preload tracer (glibc 2.17 minimum)
      shell: bash
      run: cargo zigbuild --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer-preload --target x86_64-unknown-linux-gnu.2.17

    - name: Stage Rust binaries
      shell: bash
      run: |
        mkdir -p "${{ inputs.output-dir }}"

        # zigbuild outputs to x86_64-unknown-linux-gnu/release/ regardless of the .2.17 suffix
        RELEASE_DIR="rust/target/x86_64-unknown-linux-gnu/release"

        for bin in roar-tracer roar-proxy roar-tracer-ebpf roard; do
          [ -f "$RELEASE_DIR/$bin" ] && cp "$RELEASE_DIR/$bin" "${{ inputs.output-dir }}/"
        done

        shopt -s nullglob
        for lib in \
          "$RELEASE_DIR"/libroar_tracer_preload*.so \
          "$RELEASE_DIR"/libroar-tracer-preload*.so; do
          cp "$lib" "${{ inputs.output-dir }}/"
        done

    - name: Verify binary portability
      shell: bash
      run: |
        echo "=== Checking binary dependencies ==="
        for f in "${{ inputs.output-dir }}"/*; do
          echo "--- $f ---"
          file "$f"
          if [[ "$f" == *.so ]]; then
            objdump -p "$f" | grep NEEDED || true
            objdump -p "$f" | grep GLIBC | sort -V | tail -1 || echo "(no glibc symbols)"
          else
            objdump -p "$f" | grep NEEDED || true
            objdump -p "$f" | grep GLIBC | sort -V | tail -1 || echo "(no glibc symbols)"
          fi
        done
