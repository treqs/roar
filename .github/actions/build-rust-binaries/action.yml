name: Build Rust Binaries
description: Build and stage roar Rust binaries into an output directory
inputs:
  manifest-path:
    description: Path to rust workspace manifest
    required: false
    default: rust/Cargo.toml
  output-dir:
    description: Directory to place built binaries
    required: false
    default: rust-bin
runs:
  using: composite
  steps:
    - name: Build proxy
      shell: bash
      run: cargo build --release --manifest-path "${{ inputs.manifest-path }}" -p roar-proxy

    - name: Build ptrace tracer
      shell: bash
      run: cargo build --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer

    - name: Build eBPF tracer
      shell: bash
      run: cargo build --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer-ebpf

    - name: Build preload tracer
      shell: bash
      run: cargo build --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer-preload

    - name: Stage Rust binaries
      shell: bash
      run: |
        mkdir -p "${{ inputs.output-dir }}"
        cp rust/target/release/roar-tracer "${{ inputs.output-dir }}/"
        cp rust/target/release/roar-proxy "${{ inputs.output-dir }}/"
        cp rust/target/release/roar-tracer-ebpf "${{ inputs.output-dir }}/"
        cp rust/target/release/roard "${{ inputs.output-dir }}/"
        cp rust/target/release/roar-tracer-preload "${{ inputs.output-dir }}/"

        shopt -s nullglob
        preload_libs=(
          rust/target/release/libroar_tracer_preload*.so
          rust/target/release/libroar-tracer-preload*.so
          rust/target/release/deps/libroar_tracer_preload*.so
          rust/target/release/deps/libroar-tracer-preload*.so
          rust/target/release/libroar_tracer_preload*.dylib
          rust/target/release/libroar-tracer-preload*.dylib
          rust/target/release/deps/libroar_tracer_preload*.dylib
          rust/target/release/deps/libroar-tracer-preload*.dylib
        )
        if [ "${#preload_libs[@]}" -gt 0 ]; then
          cp "${preload_libs[@]}" "${{ inputs.output-dir }}/"
        fi
