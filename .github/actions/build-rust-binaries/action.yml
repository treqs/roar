name: Build Rust Binaries
description: Build and stage roar Rust binaries into an output directory
inputs:
  manifest-path:
    description: Path to rust workspace manifest
    required: false
    default: rust/Cargo.toml
  output-dir:
    description: Directory to place built binaries
    required: false
    default: rust-bin
  target:
    description: cargo-zigbuild target triple (with optional .X.Y glibc suffix)
    required: false
    default: x86_64-unknown-linux-gnu.2.17
runs:
  using: composite
  steps:
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Install cargo-zigbuild and zig
      shell: bash
      run: |
        cargo install cargo-zigbuild
        pip install ziglang

    - name: Build proxy
      shell: bash
      run: cargo zigbuild --release --manifest-path "${{ inputs.manifest-path }}" -p roar-proxy --target "${{ inputs.target }}"

    - name: Build ptrace tracer
      shell: bash
      run: cargo zigbuild --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer --target "${{ inputs.target }}"

    - name: Build eBPF tracer
      shell: bash
      run: cargo zigbuild --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer-ebpf --target "${{ inputs.target }}"

    - name: Build preload tracer
      shell: bash
      run: cargo zigbuild --release --manifest-path "${{ inputs.manifest-path }}" -p roar-tracer-preload --target "${{ inputs.target }}"

    - name: Stage Rust binaries
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        mkdir -p "${{ inputs.output-dir }}"

        # Strip any trailing glibc suffix (".2.17" etc.) to get the cargo
        # target directory name.
        TARGET_DIR="${TARGET%%.*}"
        RELEASE_DIR="rust/target/${TARGET_DIR}/release"

        for bin in roar-tracer roar-proxy roar-tracer-ebpf roard roar-tracer-preload; do
          [ -f "$RELEASE_DIR/$bin" ] && cp "$RELEASE_DIR/$bin" "${{ inputs.output-dir }}/"
        done

        shopt -s nullglob
        for lib in \
          "$RELEASE_DIR"/libroar_tracer_preload*.so \
          "$RELEASE_DIR"/libroar-tracer-preload*.so; do
          cp "$lib" "${{ inputs.output-dir }}/"
        done

    - name: Verify binary portability
      shell: bash
      run: |
        echo "=== Checking binary dependencies ==="
        for f in "${{ inputs.output-dir }}"/*; do
          echo "--- $f ---"
          file "$f"
          objdump -p "$f" | grep NEEDED || true
          objdump -p "$f" | grep GLIBC | sort -V | tail -1 || echo "(no glibc symbols)"
        done
